{{- if eq (env "APP") "omeka-s" }}
http:
  routers:
    omeka-s-http:
      entryPoints: [web]
      rule: 'Host(`omeka-s.lehigh.edu`)'
      service: noop@internal
      middlewares: [redirect-https]
    omeka-s:
      entryPoints: [websecure]
      rule: 'Host(`omeka-s.lehigh.edu`)'
      tls: {}
      service: omeka-s
      middlewares: [rate-limit, captcha-protect]
  services:
    omeka-s:
      loadBalancer:
        servers:
          - url: 'http://127.0.0.1:{{ env "APACHE_PORT" }}'
{{- end }}

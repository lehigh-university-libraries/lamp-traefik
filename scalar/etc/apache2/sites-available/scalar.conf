# Use 127.0.0.1:8888 here and in ports.conf and APACHE_PORT if 8080 is occupied.
<VirtualHost 127.0.0.1:8080>
    ServerAdmin ccc2@lehigh.edu
    ServerName scalar.lehigh.edu

    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 127.0.0.1
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    RewriteEngine On
    RewriteCond %{HTTP_USER_AGENT} SemrushBot [NC,OR]
    RewriteCond %{HTTP_USER_AGENT} DotBot [NC,OR]
    RewriteCond %{HTTP_USER_AGENT} YandexBot [NC]
    RewriteRule . - [R=403,L]

    DocumentRoot "/opt/scalar"
    <Directory "/opt/scalar">
        Require all granted
        AllowOverride All
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    LogLevel error
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
